<style>
/* Layout: asphalt-court hero, sticky section bar with language switch, one reading column: course (10 skill modules with video ticks), planner (day/week/month/year tabs), my plans, self-tests, rules, best practices */
:root {
  --bg: #F6F5F9;
  --surface: #FFFFFF;
  --fg: #1C1727;
  --muted: #5D566C;
  --line: #E1DCE9;
  --court: #2B2537;
  --court-fg: #F3EFFA;
  --yellow: #F5C518;
  --purple: #6B3FA0;
  --on-purple: #FFFFFF;
  --pink-soft: #F7E7EF;
  --ok: #2F7D4F;
  --ok-soft: #E3F2E8;
  --track: #E9E4F0;
  --font-display: "Anton", "Impact", "Arial Narrow", sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14111B; --surface: #1E1929; --fg: #EDE9F4; --muted: #ABA3BB; --line: #322A42;
    --court: #0E0C13; --court-fg: #EDE9F4; --yellow: #F5C518; --purple: #B79AE6; --on-purple: #14111B;
    --pink-soft: #2B1F33; --ok: #6CC795; --ok-soft: #1C2E24; --track: #2C2540; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14111B; --surface: #1E1929; --fg: #EDE9F4; --muted: #ABA3BB; --line: #322A42;
  --court: #0E0C13; --court-fg: #EDE9F4; --yellow: #F5C518; --purple: #B79AE6; --on-purple: #14111B;
  --pink-soft: #2B1F33; --ok: #6CC795; --ok-soft: #1C2E24; --track: #2C2540; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(64px + env(safe-area-inset-top, 0px)); }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 900px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { margin: 0; line-height: 1.12; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.9rem, 4.6vw, 2.6rem); text-transform: uppercase; letter-spacing: .01em; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--purple); text-underline-offset: 2px; }
button { font: inherit; }
:focus-visible { outline: 3px solid var(--purple); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* hero */
.hero { background: var(--court); color: var(--court-fg); position: relative; overflow: hidden; }
.hero svg.lines { position: absolute; right: -60px; top: -40px; width: 460px; max-width: 70%; opacity: .5; pointer-events: none; color: var(--yellow); }
.hero .wrap { position: relative; padding-block: 44px 40px; display: grid; gap: 16px; }
.eyebrow { font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--yellow); }
.hero h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(3rem, 11vw, 5.6rem); text-transform: uppercase; line-height: .92; }
.hero h1 em { font-style: normal; color: var(--yellow); }
.hero .lede { max-width: 60ch; font-size: 1.06rem; opacity: .92; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.facts span { border: 1px solid rgba(245,197,24,.55); border-radius: 999px; padding: 4px 12px; font-size: .85rem; }

/* sticky bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
nav.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
nav.bar .wrap { display: flex; gap: 8px; align-items: center; padding-block: 8px; }
.navlinks { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.navlinks button { flex: none; background: none; border: 0; color: var(--fg); font-weight: 600; font-size: .9rem; padding: 6px 10px; border-radius: 999px; cursor: pointer; }
.navlinks button:hover { background: var(--pink-soft); }
.lang { flex: none; display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.lang button { border: 0; background: none; color: var(--fg); font-weight: 700; font-size: .8rem; padding: 6px 10px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--purple); color: var(--on-purple); }

section { padding-block: 44px 6px; }
section > .wrap { display: grid; gap: 18px; }
.lead { color: var(--muted); max-width: 66ch; }

/* cards & grids */
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.card b.k { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; line-height: 1; color: var(--purple); }
.card p { font-size: .94rem; }

/* progress */
.progress { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; }
.pr-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.bar-track { grid-column: 1 / -1; height: 10px; background: var(--track); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--purple); border-radius: 999px; }
.bar-fill.ok { background: var(--ok); }
.sync { font-size: .82rem; color: var(--muted); }

/* skills */
.skills { display: grid; gap: 10px; }
details.skill { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
details.skill.done { border-color: var(--ok); }
details.skill > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 3rem minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 14px 16px; }
details.skill > summary::-webkit-details-marker { display: none; }
.sn { font-family: var(--font-display); font-size: 1.9rem; line-height: 1; color: var(--purple); }
details.skill.done .sn { color: var(--ok); }
.st { display: grid; gap: 2px; min-width: 0; }
.st small { color: var(--muted); font-size: .85rem; }
.pill { font-size: .78rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--track); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.chev { width: 22px; height: 22px; transition: transform .2s; color: var(--muted); }
details[open] .chev { transform: rotate(180deg); }
.skill-body { padding: 0 16px 18px calc(16px + 3rem + 12px); display: grid; gap: 14px; }
.skill-body ul { margin: 0; padding-left: 1.15em; display: grid; gap: 5px; }
.why { background: var(--pink-soft); border-radius: 8px; padding: 10px 12px; font-size: .95rem; }
.drill { border-left: 3px solid var(--yellow); padding-left: 12px; display: grid; gap: 2px; }
.drill b { font-size: .95rem; }
.drill span { color: var(--muted); font-size: .9rem; }
.vids { display: grid; gap: 8px; }
.vid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--pink-soft); border-radius: 8px; padding: 10px 12px; }
.vid.seen { background: var(--ok-soft); }
.vid a { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; text-decoration: none; color: var(--fg); min-width: 0; }
.vid a svg { width: 20px; height: 20px; color: var(--purple); margin-top: 2px; }
.vid small { display: block; color: var(--muted); }
.tick { display: flex; gap: 6px; align-items: center; font-size: .85rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
.tick input { width: 18px; height: 18px; accent-color: var(--ok); }
.master { justify-self: start; border: 1px solid var(--ok); color: var(--ok); background: none; border-radius: 6px; padding: 7px 12px; font-weight: 600; cursor: pointer; }
.master[aria-pressed="true"] { background: var(--ok); color: var(--surface); }
@media (max-width: 560px) { .skill-body { padding-left: 16px; } details.skill > summary { grid-template-columns: 2.4rem minmax(0, 1fr) auto; } details.skill > summary .chev { display: none; } }

/* tabs */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tabs button { font-weight: 600; font-size: .9rem; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--purple); border-color: var(--purple); color: var(--on-purple); }

/* planner */
.planner { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 16px; }
.form { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); align-items: end; }
.form label, .form fieldset { display: grid; gap: 4px; font-size: .84rem; color: var(--muted); font-weight: 600; min-width: 0; }
.form fieldset { border: 0; padding: 0; margin: 0; grid-column: 1 / -1; }
.form legend { padding: 0; margin-bottom: 4px; }
.form .wide { grid-column: 1 / -1; }
.form input[type=text], .form input[type=date], .form select, .test input[type=number] { font: inherit; font-weight: 400; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; }
.days { display: flex; flex-wrap: wrap; gap: 6px; }
.days label { display: flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; color: var(--fg); font-weight: 600; cursor: pointer; }
.days input { accent-color: var(--purple); }
.btn { border: 0; border-radius: 6px; padding: 9px 16px; font-weight: 700; cursor: pointer; background: var(--purple); color: var(--on-purple); }
.btn.ghost { background: none; color: var(--purple); border: 1px solid var(--purple); }
.preview { border-top: 1px dashed var(--line); padding-top: 14px; display: grid; gap: 10px; }
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.items li { display: grid; grid-template-columns: 4.6rem minmax(0, 1fr); gap: 10px; align-items: start; border-top: 1px dashed var(--line); padding-top: 6px; }
.items li:first-child { border-top: 0; padding-top: 0; }
.items .tag { font-weight: 700; color: var(--purple); font-size: .88rem; }
.items .sub { display: block; color: var(--muted); font-size: .88rem; }
.saved-msg { color: var(--ok); font-weight: 600; font-size: .9rem; }

/* my plans */
.plans { display: grid; gap: 12px; }
.plan { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; }
.plan header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: baseline; }
.plan .goal { background: var(--pink-soft); border-radius: 8px; padding: 8px 12px; font-weight: 600; }
.plan .items li { grid-template-columns: auto 4.6rem minmax(0, 1fr); cursor: pointer; }
.plan .items input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--ok); }
.plan .items li.done .body { text-decoration: line-through; color: var(--muted); }
.plan footer { display: flex; justify-content: flex-end; gap: 8px; }
.del { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 5px 10px; font-size: .85rem; cursor: pointer; }
.del.confirm { border-color: #B3261E; color: #B3261E; }
.empty { color: var(--muted); font-style: italic; }

/* tests */
.test { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; align-content: start; }
.test p { color: var(--muted); font-size: .92rem; }
.test form { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
.test label { display: grid; gap: 4px; font-size: .82rem; color: var(--muted); }
.test input[type=number] { width: 6.5rem; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: .88rem; }
.log li { display: flex; justify-content: space-between; border-top: 1px dashed var(--line); padding-top: 4px; }
.log .best { color: var(--ok); font-weight: 700; }

.account { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.account .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.account label { display: grid; gap: 4px; font-size: .84rem; color: var(--muted); font-weight: 600; flex: 1 1 220px; min-width: 0; }
.account input[type=email] { font: inherit; font-weight: 400; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; }
.account .msg { font-size: .9rem; font-weight: 600; color: var(--ok); }
.account .err { font-size: .9rem; font-weight: 600; color: #B3261E; }
.account .small { font-size: .84rem; color: var(--muted); }
.btn.google { background: var(--surface); color: var(--fg); border: 1px solid var(--line); display: inline-flex; gap: 8px; align-items: center; }
.btn.google svg { width: 18px; height: 18px; }
.acctbtn { flex: none; border: 1px solid var(--purple); color: var(--purple); background: none; border-radius: 999px; padding: 5px 12px; font-weight: 700; font-size: .8rem; cursor: pointer; white-space: nowrap; max-width: 9rem; overflow: hidden; text-overflow: ellipsis; }
.acctbtn.in { background: var(--purple); color: var(--on-purple); }
footer.site { padding-block: 40px 48px; color: var(--muted); font-size: .84rem; }
footer.site .wrap { display: grid; gap: 10px; }
footer.site ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
footer.site a { word-break: break-word; }
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
</style>

    if (t.id === 'acctbtn') { $('plaanid').scrollIntoView({ behavior: 'smooth' }); return; }
    if (t.id === 'a-google') { acct.err = ''; auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function (er) { if (er && er.code === 'auth/popup-blocked') auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()); else if (!(er && er.code === 'auth/popup-closed-by-user')) fail(er); }); return; }
    if (t.id === 'a-out') { auth.signOut().then(function () { state = EMPTY(); try { localStorage.removeItem(KEY); } catch (er) {} acct.msg = ''; renderAll(); }); return; }
    if (t.id === 'a-del') {
      if (!acct.delPending) { acct.delPending = true; renderAccount(); return; }
      var u = auth.currentUser; if (!u) return;
      fdb.collection('users').doc(u.uid).delete().then(function () { return u.delete(); }).then(function () {
        state = EMPTY(); try { localStorage.removeItem(KEY); } catch (er) {} acct.msg = tr(T.deleted); renderAll();
      }).catch(function (er) { acct.delPending = false; if (er && er.code === 'auth/requires-recent-login') { acct.err = tr(T.reauth); renderAccount(); } else fail(er); });
    }
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'a-mail') return; e.preventDefault();
    var email = $('a-email').value.trim(); acct.err = '';
    auth.sendSignInLinkToEmail(email, { url: linkUrl, handleCodeInApp: true }).then(function () {
      try { localStorage.setItem('hoov:email', email); } catch (er) {}
      acct.msg = tr(T.linkSent).replace('{e}', email); renderAccount();
    }).catch(fail);
  });
  renderAccount();
} else if (window.claude && typeof window.claude.use === 'function') {
  /* claude.ai artifact: signed-in viewers keep progress in their private store */
  Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
    var db = r[0], user = r[1]; if (!db || !user) return null;
    return user.id().then(function (uid) {
      if (!uid) return null;
      var ref = db.doc('data/users/' + uid + '/hoov');
      return ref.get().then(function (snap) {
        cloud = { save: function (st) { ref.set(st).catch(function () {}); } };
        var remote = snap.exists ? snap.data() : null;
        if (remote && (remote.updatedAt || 0) > (state.updatedAt || 0)) adopt(remote);
        else { persist(); renderSync(); }
      });
    });
  }).catch(function () { cloud = null; renderSync(); });
}
})();
</script>
